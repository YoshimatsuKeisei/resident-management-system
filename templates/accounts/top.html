<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入居者管理システム</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f5f7;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .site-title {
            margin: 0 0 24px;
            text-align: center;
            font-size: 28px;
        }

        .login-title {
            margin: 0 0 20px;
            text-align: center;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .label-row label {
            margin-bottom: 0;
        }

        .field-error {
            color: #dc2626;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cfd6dd;
            border-radius: 4px;
            font-size: 16px;
        }

        input.input-error {
            border-color: #dc2626;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .password-reset-link {
            margin: -8px 0 16px;
            text-align: right;
            font-size: 14px;
        }

        .password-reset-link a,
        .signup-link a {
            color: #2563eb;
            text-decoration: none;
        }

        .signup-link {
            margin: 20px 0 0;
            text-align: center;
        }

        .login-message {
            margin: 0 0 16px;
            font-size: 14px;
        }

        .login-message.error {
            color: #dc2626;
        }

        .login-message.success {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1 class="site-title">入居者管理システム</h1>

        <h2 class="login-title">ログイン</h2>

        <form action="{% url 'accounts:top' %}" method="post" id="login-form" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <div class="label-row">
                    <label for="login-id">メールアドレスまたは電話番号</label>
                    <span class="field-error" id="login-id-error"></span>
                </div>
                <input type="text" id="login-id" name="login_identifier" placeholder="メールアドレスまたは電話番号">
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="password">パスワード</label>
                    <span class="field-error" id="password-error"></span>
                </div>
                <input type="password" id="password" name="password" placeholder="パスワードを入力">
            </div>

            <p class="password-reset-link">
                <a href="/password-reset/" id="password-reset-link">パスワードをお忘れですか？</a>
            </p>

            {% if login_error_message %}
                <p id="login-message" class="login-message error">{{ login_error_message }}</p>
            {% elif login_success_message %}
                <p id="login-message" class="login-message success">{{ login_success_message }}</p>
            {% endif %}

            <button type="submit">ログイン</button>
        </form>

        <p class="signup-link">
            <a href="/signup/" id="signup-link">未登録の方はこちら</a>
        </p>
    </main>
    <script>
        const loginForm = document.getElementById("login-form");
        const loginMessage = document.getElementById("login-message");
        const loginIdentifierField = document.getElementById("login-id");
        const passwordField = document.getElementById("password");
        const loginIdentifierError = document.getElementById("login-id-error");
        const passwordError = document.getElementById("password-error");
        const signupLink = document.getElementById("signup-link");
        const passwordResetLink = document.getElementById("password-reset-link");

        // メールアドレスの形だけを確認します。登録済みかどうかは画面側では調べません。
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // 電話番号の形だけを確認します。ハイフンあり・なしの数字を許可します。
        const phonePattern = /^0\d{1,4}-?\d{1,4}-?\d{3,4}$/;

        // パスワードは今回の仕様に合わせて、半角英数字のみ許可します。
        const passwordPattern = /^[A-Za-z0-9]+$/;

        function clearLoginMessage() {
            if (loginMessage) {
                loginMessage.textContent = "";
            }
        }

        function clearFieldError(field, errorElement) {
            field.classList.remove("input-error");
            errorElement.textContent = "";
        }

        function setFieldError(field, errorElement, message) {
            field.classList.add("input-error");
            errorElement.textContent = message;
        }

        // 入力中に古いエラー表示を消して、次の入力をしやすくします。
        [loginIdentifierField, passwordField].forEach(function (field) {
            field.addEventListener("click", clearLoginMessage);
            field.addEventListener("input", function () {
                clearLoginMessage();
                if (field === loginIdentifierField) {
                    clearFieldError(loginIdentifierField, loginIdentifierError);
                } else {
                    clearFieldError(passwordField, passwordError);
                }
            });
        });

        loginForm.addEventListener("submit", function (event) {
            const loginIdentifier = loginIdentifierField.value.trim();
            const password = passwordField.value;
            let hasError = false;

            clearLoginMessage();
            clearFieldError(loginIdentifierField, loginIdentifierError);
            clearFieldError(passwordField, passwordError);

            if (loginIdentifier !== "" && !emailPattern.test(loginIdentifier) && !phonePattern.test(loginIdentifier)) {
                setFieldError(loginIdentifierField, loginIdentifierError, "入力形式が正しくありません。");
                hasError = true;
            }

            if (password !== "" && !passwordPattern.test(password)) {
                setFieldError(passwordField, passwordError, "形式が違います。半角英数字のみの入力です。");
                hasError = true;
            }

            if (hasError) {
                event.preventDefault();
            }
        });

        // リンクを押す直前に、ログイン結果メッセージだけ消します。
        signupLink.addEventListener("click", clearLoginMessage);
        passwordResetLink.addEventListener("click", clearLoginMessage);
    </script>
</body>
</html>
