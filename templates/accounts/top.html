<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入居者管理システム</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f5f7;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .site-title {
            margin: 0 0 24px;
            text-align: center;
            font-size: 28px;
        }

        .login-title {
            margin: 0 0 20px;
            text-align: center;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cfd6dd;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-link {
            margin: 20px 0 0;
            text-align: center;
        }

        .signup-link a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1 class="site-title">入居者管理システム</h1>

        <h2 class="login-title">ログイン</h2>

        <form action="#">
            <div class="form-group">
                <label for="login-id">メールアドレスまたは電話番号</label>
                <input type="text" id="login-id" name="login_id" placeholder="メールアドレスまたは電話番号">
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" placeholder="パスワードを入力">
            </div>

            <button type="button">ログイン</button>
        </form>

        <p class="signup-link">
            <a href="#">未登録の方はこちら</a>
        </p>
    </main>
</body>
</html>
