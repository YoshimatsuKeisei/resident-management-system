<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入居者管理システム</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f5f7;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .site-title {
            margin: 0 0 24px;
            text-align: center;
            font-size: 28px;
        }

        .login-title {
            margin: 0 0 20px;
            text-align: center;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cfd6dd;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-link {
            margin: 20px 0 0;
            text-align: center;
        }

        .signup-link a {
            color: #2563eb;
            text-decoration: none;
        }

        .login-message {
            margin: 0 0 16px;
            font-size: 14px;
        }

        .login-message.error {
            color: #dc2626;
        }

        .login-message.success {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1 class="site-title">入居者管理システム</h1>

        <h2 class="login-title">ログイン</h2>

        <form action="{% url 'accounts:top' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="login-id">メールアドレスまたは電話番号</label>
                <input type="text" id="login-id" name="login_identifier" placeholder="メールアドレスまたは電話番号">
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" placeholder="パスワードを入力">
            </div>

            {% if login_error_message %}
                <p id="login-message" class="login-message error">{{ login_error_message }}</p>
            {% elif login_success_message %}
                <p id="login-message" class="login-message success">{{ login_success_message }}</p>
            {% endif %}

            <button type="submit">ログイン</button>
        </form>

        <p class="signup-link">
            <a href="/signup/" id="signup-link">未登録の方はこちら</a>
        </p>
    </main>
    <script>
        const loginMessage = document.getElementById("login-message");
        const loginIdentifierField = document.getElementById("login-id");
        const passwordField = document.getElementById("password");
        const signupLink = document.getElementById("signup-link");

        // clearLoginMessageは、画面に表示されているログイン結果メッセージを消す関数です。
        function clearLoginMessage() {
            if (loginMessage) {
                loginMessage.textContent = "";
            }
        }

        // 入力欄をクリック、または入力したら、古いログイン結果メッセージを消します。
        [loginIdentifierField, passwordField].forEach(function (field) {
            field.addEventListener("click", clearLoginMessage);
            field.addEventListener("input", clearLoginMessage);
        });

        // 未登録リンクをクリックした時もメッセージを消します。リンク先への移動はそのまま行われます。
        signupLink.addEventListener("click", clearLoginMessage);
    </script>
</body>
</html>
