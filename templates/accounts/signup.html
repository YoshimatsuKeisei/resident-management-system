<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 | 入居者管理システム</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f5f7;
            font-family: Arial, sans-serif;
        }

        .signup-card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .site-title {
            margin: 0 0 24px;
            text-align: center;
            font-size: 28px;
        }

        .signup-title {
            margin: 0 0 20px;
            text-align: center;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cfd6dd;
            border-radius: 4px;
            font-size: 16px;
        }

        input.error,
        select.error {
            border-color: #dc2626;
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            width: auto;
            padding: 4px 8px;
            transform: translateY(-50%);
            border: none;
            border-radius: 4px;
            background-color: transparent;
            color: #4b5563;
            font-size: 14px;
            font-weight: normal;
            cursor: pointer;
        }

        .password-toggle:hover {
            background-color: #eef2f7;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .field-error {
            margin-left: 8px;
            color: #dc2626;
            font-size: 13px;
            font-weight: normal;
        }

        .error-message {
            margin: 0 0 16px;
            color: #dc2626;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="signup-card">
        <h1 class="site-title">入居者管理システム</h1>

        <h2 class="signup-title">新規登録</h2>

        <form action="{% url 'accounts:signup' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="tenant-name">入居者名<span id="tenant-name-error" class="field-error"></span></label>
                <input type="text" id="tenant-name" name="tenant_name" placeholder="例）山田 太郎">
            </div>

            <div class="form-group">
                <label for="email">メールアドレス<span id="email-error" class="field-error"></span></label>
                <input type="email" id="email" name="email" placeholder="例）example@example.com">
            </div>

            <div class="form-group">
                <label for="password">パスワード<span id="password-error" class="field-error"></span></label>
                <div class="password-field">
                    <input type="password" id="password" name="password" placeholder="例）abc123">
                    <button type="button" class="password-toggle" data-target="password" aria-label="パスワードを表示">目</button>
                </div>
            </div>

            <div class="form-group">
                <label for="password-confirm">パスワード確認<span id="password-confirm-error" class="field-error"></span></label>
                <div class="password-field">
                    <input type="password" id="password-confirm" name="password_confirm" placeholder="もう一度入力してください">
                    <button type="button" class="password-toggle" data-target="password-confirm" aria-label="パスワード確認を表示">目</button>
                </div>
            </div>

            <div class="form-group">
                <label for="phone-number">電話番号<span id="phone-number-error" class="field-error"></span></label>
                <input type="tel" id="phone-number" name="phone_number" placeholder="例）09012345678">
            </div>

            <div class="form-group">
                <label for="postal-code">郵便番号<span id="postal-code-error" class="field-error"></span></label>
                <input type="text" id="postal-code" name="postal_code" placeholder="例）1000001" maxlength="8">
            </div>

            <div class="form-group">
                <label for="prefecture">都道府県<span id="prefecture-error" class="field-error"></span></label>
                <select id="prefecture" name="prefecture">
                    <option value="">選択してください</option>
                    <option value="北海道">北海道</option>
                    <option value="青森県">青森県</option>
                    <option value="岩手県">岩手県</option>
                    <option value="宮城県">宮城県</option>
                    <option value="秋田県">秋田県</option>
                    <option value="山形県">山形県</option>
                    <option value="福島県">福島県</option>
                    <option value="茨城県">茨城県</option>
                    <option value="栃木県">栃木県</option>
                    <option value="群馬県">群馬県</option>
                    <option value="埼玉県">埼玉県</option>
                    <option value="千葉県">千葉県</option>
                    <option value="東京都">東京都</option>
                    <option value="神奈川県">神奈川県</option>
                    <option value="新潟県">新潟県</option>
                    <option value="富山県">富山県</option>
                    <option value="石川県">石川県</option>
                    <option value="福井県">福井県</option>
                    <option value="山梨県">山梨県</option>
                    <option value="長野県">長野県</option>
                    <option value="岐阜県">岐阜県</option>
                    <option value="静岡県">静岡県</option>
                    <option value="愛知県">愛知県</option>
                    <option value="三重県">三重県</option>
                    <option value="滋賀県">滋賀県</option>
                    <option value="京都府">京都府</option>
                    <option value="大阪府">大阪府</option>
                    <option value="兵庫県">兵庫県</option>
                    <option value="奈良県">奈良県</option>
                    <option value="和歌山県">和歌山県</option>
                    <option value="鳥取県">鳥取県</option>
                    <option value="島根県">島根県</option>
                    <option value="岡山県">岡山県</option>
                    <option value="広島県">広島県</option>
                    <option value="山口県">山口県</option>
                    <option value="徳島県">徳島県</option>
                    <option value="香川県">香川県</option>
                    <option value="愛媛県">愛媛県</option>
                    <option value="高知県">高知県</option>
                    <option value="福岡県">福岡県</option>
                    <option value="佐賀県">佐賀県</option>
                    <option value="長崎県">長崎県</option>
                    <option value="熊本県">熊本県</option>
                    <option value="大分県">大分県</option>
                    <option value="宮崎県">宮崎県</option>
                    <option value="鹿児島県">鹿児島県</option>
                    <option value="沖縄県">沖縄県</option>
                </select>
            </div>

            <div class="form-group">
                <label for="city">市区町村<span id="city-error" class="field-error"></span></label>
                <input type="text" id="city" name="city" placeholder="例）千代田区">
            </div>

            <div class="form-group">
                <label for="street-address">町名・丁目・番地<span id="street-address-error" class="field-error"></span></label>
                <input type="text" id="street-address" name="street_address" placeholder="例）千代田1-1">
            </div>

            <div class="form-group">
                <label for="building-name">建物名・部屋番号 任意</label>
                <input type="text" id="building-name" name="building_name" placeholder="例）サンプルマンション101号室">
            </div>

            <div class="form-group">
                <label for="birth-date">生年月日<span id="birth-date-error" class="field-error"></span></label>
                <input type="text" id="birth-date" name="birth_date" placeholder="例）2000-01-01">
            </div>

            {% if success_message %}
                <p class="success-message">{{ success_message }}</p>
            {% endif %}

            <p id="form-error" class="error-message">{{ error_message }}</p>

            <button type="submit">登録</button>
        </form>
    </main>

    <script>
        // requiredFieldIdsは、登録ボタンを押したときに入力必須として確認する項目のid一覧です。
        const requiredFieldIds = [
            "tenant-name",
            "email",
            "password",
            "password-confirm",
            "phone-number",
            "postal-code",
            "prefecture",
            "city",
            "street-address",
            "birth-date",
        ];

        // validationRulesは、各入力欄の形式チェックに使うメッセージと正規表現をまとめたものです。
        const validationRules = {
            "tenant-name": {
                message: "氏名の形式が正しくありません",
                pattern: /^[\p{L}\p{M}]+(?: [\p{L}\p{M}]+)?$/u,
            },
            email: {
                message: "メールアドレスの形式が正しくありません",
                pattern: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
            },
            "phone-number": {
                message: "電話番号の形式が正しくありません",
                pattern: /^[0-9-]+$/,
            },
            password: {
                message: "形式が違います。半角英数字のみの入力です。",
                pattern: /^[A-Za-z0-9]+$/,
            },
            "password-confirm": {
                message: "形式が違います。半角英数字のみの入力です。",
                pattern: /^[A-Za-z0-9]+$/,
            },
            "postal-code": {
                message: "郵便番号の形式が正しくありません",
                pattern: /^(\d{7}|\d{3}-\d{4})$/,
            },
            "birth-date": {
                message: "生年月日の形式が正しくありません",
                pattern: /^\d{4}-\d{2}-\d{2}$/,
            },
        };

        // getErrorElementは、入力欄に対応するエラーメッセージ表示用のspanを取得する関数です。
        function getErrorElement(fieldId) {
            return document.getElementById(fieldId + "-error");
        }

        // setFieldErrorは、入力欄を赤枠にして、ラベル横にエラーメッセージを表示する関数です。
        function setFieldError(field, message) {
            const errorElement = getErrorElement(field.id);

            field.classList.add("error");

            if (errorElement) {
                errorElement.textContent = message;
            }
        }

        // clearFieldErrorは、入力欄の赤枠とラベル横のエラーメッセージを消す関数です。
        function clearFieldError(field) {
            const errorElement = getErrorElement(field.id);

            field.classList.remove("error");

            if (errorElement) {
                errorElement.textContent = "";
            }
        }

        // isPhoneNumberValidは、ハイフンを除いた電話番号が10桁か11桁か確認する関数です。
        function isPhoneNumberValid(value) {
            const numberOnlyValue = value.replaceAll("-", "");

            return validationRules["phone-number"].pattern.test(value) && /^\d{10,11}$/.test(numberOnlyValue);
        }

        // validateFormatは、入力された値が各項目の形式に合っているか確認する関数です。
        function validateFormat(field) {
            const rule = validationRules[field.id];
            const value = field.value.trim();

            if (!rule || value === "") {
                clearFieldError(field);
                return true;
            }

            if (field.id === "phone-number" && !isPhoneNumberValid(value)) {
                setFieldError(field, rule.message);
                return false;
            }

            if (field.id !== "phone-number" && !rule.pattern.test(value)) {
                setFieldError(field, rule.message);
                return false;
            }

            clearFieldError(field);
            return true;
        }

        // validatePasswordFieldsは、パスワードの形式と確認欄との一致を確認する関数です。
        function validatePasswordFields() {
            const passwordField = document.getElementById("password");
            const passwordConfirmField = document.getElementById("password-confirm");
            const isPasswordFormatValid = validateFormat(passwordField);
            const isPasswordConfirmFormatValid = validateFormat(passwordConfirmField);

            if (!isPasswordFormatValid || !isPasswordConfirmFormatValid) {
                return false;
            }

            if (passwordField.value.trim() === "" || passwordConfirmField.value.trim() === "") {
                return true;
            }

            if (passwordField.value !== passwordConfirmField.value) {
                setFieldError(passwordConfirmField, "パスワードが一致しません。");
                return false;
            }

            clearFieldError(passwordConfirmField);
            return true;
        }

        // validateRequiredFieldsは、必須項目が空欄になっていないか確認する関数です。
        function validateRequiredFields() {
            let hasEmptyField = false;

            requiredFieldIds.forEach(function (fieldId) {
                const field = document.getElementById(fieldId);

                if (field.value.trim() === "") {
                    setFieldError(field, "必須項目です");
                    hasEmptyField = true;
                } else if (field.id === "password" || field.id === "password-confirm") {
                    validatePasswordFields();
                } else {
                    validateFormat(field);
                }
            });

            return !hasEmptyField;
        }

        // fetchAddressByPostalCodeは、ZipCloud APIから郵便番号に対応する住所を取得する関数です。
        async function fetchAddressByPostalCode(postalCode) {
            const prefectureField = document.getElementById("prefecture");
            const cityField = document.getElementById("city");
            const apiUrl = "https://zipcloud.ibsnet.co.jp/api/search?zipcode=" + postalCode;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    return;
                }

                const result = data.results[0];

                // address1は都道府県、address2とaddress3は市区町村として画面に入れます。
                prefectureField.value = result.address1;
                cityField.value = result.address2 + result.address3;

                clearFieldError(prefectureField);
                clearFieldError(cityField);
            } catch (error) {
                console.error("住所の取得に失敗しました。", error);
            }
        }

        // 入力中に形式チェックを行うため、対象の入力欄にinputイベントを設定します。
        Object.keys(validationRules).forEach(function (fieldId) {
            const field = document.getElementById(fieldId);

            field.addEventListener("input", function () {
                if (field.id === "password" || field.id === "password-confirm") {
                    validatePasswordFields();
                } else {
                    validateFormat(field);
                }
            });
        });

        // 目のボタンを押すと、パスワード欄の表示と非表示を切り替えます。
        document.querySelectorAll(".password-toggle").forEach(function (button) {
            button.addEventListener("click", function () {
                const targetField = document.getElementById(button.dataset.target);
                const isHidden = targetField.type === "password";

                targetField.type = isHidden ? "text" : "password";
                button.textContent = isHidden ? "隠" : "目";
            });
        });

        // 郵便番号が7桁になった時だけ、ZipCloud APIに問い合わせます。
        document.getElementById("postal-code").addEventListener("input", function () {
            const postalCode = this.value.replaceAll("-", "");

            if (postalCode.length === 7 && /^\d{7}$/.test(postalCode)) {
                fetchAddressByPostalCode(postalCode);
            }
        });

        // 入力済みになった必須項目の赤枠を外すため、必須項目にinput/changeイベントを設定します。
        requiredFieldIds.forEach(function (fieldId) {
            const field = document.getElementById(fieldId);
            const eventName = field.tagName === "SELECT" ? "change" : "input";

            field.addEventListener(eventName, function () {
                const formError = document.getElementById("form-error");

                if (field.id === "password" || field.id === "password-confirm") {
                    validatePasswordFields();
                } else if (field.value.trim() !== "") {
                    validateFormat(field);
                }

                formError.textContent = "";
            });
        });

        // フォーム送信時に、未入力チェックと形式チェックを行います。
        // エラーがある場合はevent.preventDefault()でPOST送信を止めます。
        document.querySelector("form").addEventListener("submit", function (event) {
            const formError = document.getElementById("form-error");
            const isRequiredValid = validateRequiredFields();

            if (!isRequiredValid) {
                event.preventDefault();
                formError.textContent = "入力していない項目があります。";
                return;
            }

            let isFormatValid = true;

            Object.keys(validationRules).forEach(function (fieldId) {
                const field = document.getElementById(fieldId);

                if (field.id === "password" || field.id === "password-confirm") {
                    if (!validatePasswordFields()) {
                        isFormatValid = false;
                    }
                } else if (!validateFormat(field)) {
                    isFormatValid = false;
                }
            });

            if (!isFormatValid) {
                event.preventDefault();
                formError.textContent = "";
            }
        });
    </script>
</body>
</html>
