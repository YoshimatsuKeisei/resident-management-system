<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新規登録 | 入居者管理システム</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f3f5f7;
        font-family: Arial, sans-serif;
      }

      .signup-card {
        width: 100%;
        max-width: 440px;
        padding: 32px;
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }

      .site-title {
        margin: 0 0 24px;
        text-align: center;
        font-size: 28px;
      }

      .signup-title {
        margin: 0 0 20px;
        text-align: center;
        font-size: 20px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #cfd6dd;
        border-radius: 4px;
        font-size: 16px;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 4px;
        background-color: #2563eb;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="signup-card">
      <h1 class="site-title">入居者管理システム</h1>

      <h2 class="signup-title">新規登録</h2>

      <form action="#">
        <div class="form-group">
          <label for="tenant-name">入居者名</label>
          <input
            type="text"
            id="tenant-name"
            name="tenant_name"
            placeholder="例）山田 太郎"
          />
        </div>

        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="例）example@example.com"
          />
        </div>

        <div class="form-group">
          <label for="phone-number">電話番号</label>
          <input
            type="tel"
            id="phone-number"
            name="phone_number"
            placeholder="例）09012345678"
          />
        </div>
        <div class="form-group">
          <label for="postal-code">郵便番号</label>
          <input
            type="text"
            id="postal-code"
            name="postal_code"
            placeholder="例）1000001"
            maxlength="8"
          />
        </div>

        <div class="form-group">
          <label for="prefecture">都道府県</label>
          <select id="prefecture" name="prefecture" required>
            <option value="">選択してください</option>
            <option value="北海道">北海道</option>
            <option value="青森県">青森県</option>
            <option value="岩手県">岩手県</option>
            <option value="宮城県">宮城県</option>
            <option value="秋田県">秋田県</option>
            <option value="山形県">山形県</option>
            <option value="福島県">福島県</option>
            <option value="茨城県">茨城県</option>
            <option value="栃木県">栃木県</option>
            <option value="群馬県">群馬県</option>
            <option value="埼玉県">埼玉県</option>
            <option value="千葉県">千葉県</option>
            <option value="東京都">東京都</option>
            <option value="神奈川県">神奈川県</option>
            <option value="新潟県">新潟県</option>
            <option value="富山県">富山県</option>
            <option value="石川県">石川県</option>
            <option value="福井県">福井県</option>
            <option value="山梨県">山梨県</option>
            <option value="長野県">長野県</option>
            <option value="岐阜県">岐阜県</option>
            <option value="静岡県">静岡県</option>
            <option value="愛知県">愛知県</option>
            <option value="三重県">三重県</option>
            <option value="滋賀県">滋賀県</option>
            <option value="京都府">京都府</option>
            <option value="大阪府">大阪府</option>
            <option value="兵庫県">兵庫県</option>
            <option value="奈良県">奈良県</option>
            <option value="和歌山県">和歌山県</option>
            <option value="鳥取県">鳥取県</option>
            <option value="島根県">島根県</option>
            <option value="岡山県">岡山県</option>
            <option value="広島県">広島県</option>
            <option value="山口県">山口県</option>
            <option value="徳島県">徳島県</option>
            <option value="香川県">香川県</option>
            <option value="愛媛県">愛媛県</option>
            <option value="高知県">高知県</option>
            <option value="福岡県">福岡県</option>
            <option value="佐賀県">佐賀県</option>
            <option value="長崎県">長崎県</option>
            <option value="熊本県">熊本県</option>
            <option value="大分県">大分県</option>
            <option value="宮崎県">宮崎県</option>
            <option value="鹿児島県">鹿児島県</option>
            <option value="沖縄県">沖縄県</option>
          </select>
        </div>

        <div class="form-group">
          <label for="city">市区町村</label>
          <input
            type="text"
            id="city"
            name="city"
            placeholder="例）千代田区"
            required
          />
        </div>

        <div class="form-group">
          <label for="street-address">丁目・番地</label>
          <input
            type="text"
            id="street-address"
            name="street_address"
            placeholder="例）千代田1-1"
            required
          />
        </div>

        <div class="form-group">
          <label for="building-name">建物名・部屋番号 任意</label>
          <input
            type="text"
            id="building-name"
            name="building_name"
            placeholder="例）〇〇マンション101号室"
          />
        </div>

        <p id="postal-code-error" class="error-message"></p>

        <div class="form-group">
          <label for="birth-date">生年月日</label>
          <input
            type="text"
            id="birth-date"
            name="birth_date"
            placeholder="例）2000-01-01"
          />
        </div>

        <button type="button">登録</button>
      </form>
    </main>
    <script>
      // 郵便番号の入力欄を取得する
      const postalCodeInput = document.getElementById("postal-code");

      // 都道府県のセレクトボックスを取得する
      const prefectureSelect = document.getElementById("prefecture");

      // 市区町村の入力欄を取得する
      const cityInput = document.getElementById("city");
      // 町名・丁目・番地の入力欄を取得する
      const streetAddressInput = document.getElementById("street-address");

      // エラーメッセージを表示する場所を取得する
      const errorMessage = document.getElementById("postal-code-error");

      // 直前に検索した郵便番号を保存する変数
      let lastSearchedPostalCode = "";

      // 郵便番号が入力されるたびに処理を実行する
      postalCodeInput.addEventListener("input", async function () {
        // ハイフンと前後の空白を取り除く
        const postalCode = postalCodeInput.value.replace("-", "").trim();

        // 7桁になるまでは検索しない
        if (postalCode.length !== 7) {
          errorMessage.textContent = "";
          return;
        }

        // 同じ郵便番号で何度も検索しない
        if (postalCode === lastSearchedPostalCode) {
          return;
        }

        lastSearchedPostalCode = postalCode;

        try {
          const response = await fetch(
            `https://zipcloud.ibsnet.co.jp/api/search?zipcode=${postalCode}`,
          );

          const data = await response.json();

          if (data.results === null) {
            errorMessage.textContent = "該当する住所が見つかりませんでした。";
            prefectureSelect.value = "";
            cityInput.value = "";
            return;
          }

          const result = data.results[0];

          // address1：都道府県
          prefectureSelect.value = result.address1;

          // address2,address3：市区町村
          cityInput.value = result.address2 + result.address3;

          //以降の入力はユーザーに手作業でやってもらう
          errorMessage.textContent = "";
        } catch (error) {
          errorMessage.textContent = "住所検索中にエラーが発生しました。";
        }
      });
    </script>
  </body>
</html>
