<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード変更</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f5f7;
            font-family: Arial, sans-serif;
        }

        .password-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        label {
            display: block;
            font-weight: bold;
        }

        .field-error {
            color: #dc2626;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cfd6dd;
            border-radius: 4px;
            font-size: 16px;
        }

        input.input-error {
            border-color: #dc2626;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            width: 28px;
            height: 28px;
            padding: 0;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #111827;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }

        .form-message {
            margin: 0 0 16px;
            font-size: 14px;
        }

        .form-message.error {
            color: #dc2626;
        }

        .form-message.success {
            color: #2563eb;
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-link {
            margin: 20px 0 0;
            text-align: center;
        }

        .back-link a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="password-card">
        <h1>パスワード変更</h1>

        <form action="{% url 'accounts:password_reset' %}" method="post" id="password-reset-form" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <div class="label-row">
                    <label for="login-identifier">登録済みのメールアドレスまたは電話番号</label>
                    <span class="field-error" id="login-identifier-error"></span>
                </div>
                <input type="text" id="login-identifier" name="login_identifier" value="{{ login_identifier }}" placeholder="メールアドレスまたは電話番号">
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="new-password">新規パスワード</label>
                    <span class="field-error" id="new-password-error"></span>
                </div>
                <div class="password-wrap">
                    <input type="password" id="new-password" name="new_password" placeholder="新規パスワード">
                    <button type="button" class="toggle-password" data-target="new-password" aria-label="パスワード表示切り替え">◉</button>
                </div>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="new-password-confirm">新規パスワード確認</label>
                    <span class="field-error" id="new-password-confirm-error"></span>
                </div>
                <div class="password-wrap">
                    <input type="password" id="new-password-confirm" name="new_password_confirm" placeholder="新規パスワード確認">
                    <button type="button" class="toggle-password" data-target="new-password-confirm" aria-label="パスワード確認表示切り替え">◉</button>
                </div>
            </div>

            <p class="form-message error" id="required-error"></p>

            {% if error_message %}
                <p class="form-message error">{{ error_message }}</p>
            {% elif success_message %}
                <p class="form-message success">{{ success_message }}</p>
            {% endif %}

            <button type="submit" class="submit-button">決定</button>
        </form>

        <p class="back-link">
            <a href="/">ログイン画面へ戻る</a>
        </p>
    </main>

    <script>
        const form = document.getElementById("password-reset-form");
        const loginIdentifierField = document.getElementById("login-identifier");
        const newPasswordField = document.getElementById("new-password");
        const newPasswordConfirmField = document.getElementById("new-password-confirm");
        const requiredError = document.getElementById("required-error");

        const loginIdentifierError = document.getElementById("login-identifier-error");
        const newPasswordError = document.getElementById("new-password-error");
        const newPasswordConfirmError = document.getElementById("new-password-confirm-error");

        // メールアドレスの形だけを確認します。登録済みかどうかは確認しません。
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // 電話番号の形だけを確認します。ハイフンあり・なしの数字を許可します。
        const phonePattern = /^0\d{1,4}-?\d{1,4}-?\d{3,4}$/;

        // パスワードは今回の仕様に合わせて、半角英数字のみ許可します。
        const passwordPattern = /^[A-Za-z0-9]+$/;

        function clearFieldError(field, errorElement) {
            field.classList.remove("input-error");
            errorElement.textContent = "";
        }

        function setFieldError(field, errorElement, message) {
            field.classList.add("input-error");
            errorElement.textContent = message;
        }

        // 目玉アイコンを押すたびに、パスワードを見せる状態と隠す状態を切り替えます。
        document.querySelectorAll(".toggle-password").forEach(function (button) {
            button.addEventListener("click", function () {
                const targetField = document.getElementById(button.dataset.target);
                if (targetField.type === "password") {
                    targetField.type = "text";
                    button.textContent = "◎";
                } else {
                    targetField.type = "password";
                    button.textContent = "◉";
                }
            });
        });

        // 入力し直したときに、古い赤枠やエラー文を消します。
        [
            [loginIdentifierField, loginIdentifierError],
            [newPasswordField, newPasswordError],
            [newPasswordConfirmField, newPasswordConfirmError],
        ].forEach(function (item) {
            item[0].addEventListener("input", function () {
                requiredError.textContent = "";
                clearFieldError(item[0], item[1]);
            });
        });

        form.addEventListener("submit", function (event) {
            const loginIdentifier = loginIdentifierField.value.trim();
            const newPassword = newPasswordField.value;
            const newPasswordConfirm = newPasswordConfirmField.value;
            let hasError = false;

            requiredError.textContent = "";
            clearFieldError(loginIdentifierField, loginIdentifierError);
            clearFieldError(newPasswordField, newPasswordError);
            clearFieldError(newPasswordConfirmField, newPasswordConfirmError);

            if (loginIdentifier === "" || newPassword === "" || newPasswordConfirm === "") {
                requiredError.textContent = "入力していない項目があります。";
                if (loginIdentifier === "") {
                    loginIdentifierField.classList.add("input-error");
                }
                if (newPassword === "") {
                    newPasswordField.classList.add("input-error");
                }
                if (newPasswordConfirm === "") {
                    newPasswordConfirmField.classList.add("input-error");
                }
                hasError = true;
            }

            if (loginIdentifier !== "" && !emailPattern.test(loginIdentifier) && !phonePattern.test(loginIdentifier)) {
                setFieldError(loginIdentifierField, loginIdentifierError, "入力形式が正しくありません。");
                hasError = true;
            }

            if (newPassword !== "" && !passwordPattern.test(newPassword)) {
                setFieldError(newPasswordField, newPasswordError, "形式が違います。半角英数字のみの入力です。");
                hasError = true;
            }

            if (newPasswordConfirm !== "" && !passwordPattern.test(newPasswordConfirm)) {
                setFieldError(newPasswordConfirmField, newPasswordConfirmError, "形式が違います。半角英数字のみの入力です。");
                hasError = true;
            }

            if (newPassword !== "" && newPasswordConfirm !== "" && newPassword !== newPasswordConfirm) {
                setFieldError(newPasswordConfirmField, newPasswordConfirmError, "パスワードが一致しません。");
                hasError = true;
            }

            if (hasError) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
